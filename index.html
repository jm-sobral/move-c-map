<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MOVE-C Network Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  color-scheme: light;
  --bg: #eef1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --ink: #17202b;
  --muted: #5a6574;
  --faint: #8a94a2;
  --rule: #dde2e8;
  --focus: #1c5d99;
  --smtuc: #d99a06;
  --mm: #0d8a78;
  --sit: #8a3aa8;
  --shadow: 0 1px 2px rgba(20, 30, 45, .08), 0 8px 24px rgba(20, 30, 45, .10);
  --tile-opacity: .72;
  --font-ui: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-sign: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1319; --panel: #151c25; --panel-2: #1b2430; --ink: #e5eaf0; --muted: #a0abb9;
    --faint: #6f7b8a; --rule: #273241; --focus: #7db4ea; --smtuc: #f0b429; --mm: #2bb7a2; --sit: #c07ad8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    --tile-opacity: .42;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1319; --panel: #151c25; --panel-2: #1b2430; --ink: #e5eaf0; --muted: #a0abb9;
  --faint: #6f7b8a; --rule: #273241; --focus: #7db4ea; --smtuc: #f0b429; --mm: #2bb7a2; --sit: #c07ad8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  --tile-opacity: .42;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui);
  display: grid; grid-template-columns: 400px 1fr; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- panel ---------- */
#panel {
  background: var(--panel); border-right: 1px solid var(--rule); display: flex; flex-direction: column;
  min-height: 0; z-index: 500; padding-top: env(safe-area-inset-top, 0px);
}
.masthead { padding: 18px 20px 14px; display: grid; gap: 2px; border-bottom: 1px solid var(--rule); }
.masthead h1 {
  margin: 0; font: 700 26px/1 var(--font-sign); letter-spacing: .01em; display: flex; align-items: baseline; gap: 8px;
}
.masthead h1 .tag { font: 600 13px/1 var(--font-sign); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.masthead p { margin: 0; color: var(--muted); font-size: 13px; }

.overlays { padding: 12px 20px 4px; display: grid; gap: 6px; }
.label { font: 600 12px/1 var(--font-sign); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.op-toggle {
  display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; text-align: left;
}
.op-toggle:hover { background: var(--panel-2); }
.op-toggle .sw { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--c); display: grid; place-items: center; }
.op-toggle[aria-pressed="true"] .sw { background: var(--c); }
.op-toggle[aria-pressed="true"] .sw::after { content: ""; width: 8px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
.op-toggle .nm { font-weight: 700; }
.op-toggle .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.op-toggle .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }

.search { padding: 10px 20px 10px; }
.search input {
  width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2);
}
.search input::placeholder { color: var(--faint); }

#view { flex: 1; overflow-y: auto; min-height: 0; padding: 0 20px 24px; }
.group-h { position: sticky; top: 0; background: var(--panel); padding: 12px 0 6px; display: flex; justify-content: space-between; align-items: baseline; z-index: 1; }
.list { list-style: none; margin: 0; padding: 0; display: grid; }
.row {
  display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; width: 100%; text-align: left;
  padding: 7px 6px; border: 0; background: none; border-radius: 6px; cursor: pointer;
}
.row:hover { background: var(--panel-2); }
.row .t { font-size: 14px; }
.row .t small { display: block; color: var(--muted); font-size: 12px; }

.badge {
  display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 26px; padding: 0 7px;
  border-radius: 5px; font: 700 17px/1 var(--font-sign); letter-spacing: .02em; background: var(--c); color: var(--tc, #fff);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.badge.sm { min-width: 36px; height: 22px; font-size: 15px; }
.stop-ico { width: 44px; height: 26px; display: grid; place-items: center; }
.stop-ico i { width: 12px; height: 12px; border-radius: 50%; border: 3px solid var(--c); background: var(--panel); }

/* ---------- detail ---------- */
.back { display: inline-flex; gap: 6px; align-items: center; margin: 12px 0 4px; padding: 4px 8px 4px 4px; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 6px; }
.back:hover { background: var(--panel-2); color: var(--ink); }
.d-head { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 6px 0 12px; }
.d-head .badge { height: 38px; min-width: 60px; font-size: 26px; border-radius: 7px; }
.d-head h2 { margin: 0; font: 700 20px/1.15 var(--font-ui); text-wrap: balance; }
.d-head .op { color: var(--muted); font-size: 13px; }
.section { border-top: 1px solid var(--rule); padding: 12px 0; display: grid; gap: 8px; }
.variants { display: grid; gap: 6px; }
.variant {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer;
}
.variant:hover { background: var(--panel-2); }
.variant[aria-pressed="true"] { border-color: var(--c); box-shadow: inset 3px 0 0 var(--c); background: var(--panel-2); }
.variant .to { font-weight: 700; font-size: 14px; }
.variant .meta { grid-column: 1 / -1; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.variant .km { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); background: var(--panel-2); border-radius: 6px; padding: 8px 10px; }

.stops { list-style: none; margin: 0; padding: 0; position: relative; }
.stops::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--c); }
.stops li button {
  position: relative; display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; width: 100%;
  padding: 4px 4px 4px 0; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px;
}
.stops li button:hover { background: var(--panel-2); }
.stops li .dot { width: 18px; height: 18px; display: grid; place-items: center; }
.stops li .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 3px solid var(--c); }
.stops li.end .dot::after { width: 12px; height: 12px; background: var(--c); border-color: var(--ink); border-width: 2px; }
.stops li .nm { font-size: 14px; }
.stops li .x { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; max-width: 150px; }
.xb { font: 600 11px/1 var(--font-sign); padding: 2px 4px; border-radius: 3px; background: var(--c); color: var(--tc, #fff); }

.roads { list-style: none; margin: 0; padding: 0; counter-reset: r; display: grid; gap: 2px; }
.roads li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.roads li:last-child { border-bottom: 0; }
.roads li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.road-ref { font: 700 12px/1 var(--font-sign); letter-spacing: .03em; padding: 2px 5px; border-radius: 3px; background: var(--ink); color: var(--panel); margin-right: 6px; }

.served { display: grid; gap: 6px; }
.served-row { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: start; width: 100%; padding: 6px; border: 0; background: none; border-radius: 6px; text-align: left; cursor: pointer; }
.served-row:hover { background: var(--panel-2); }
.served-row .t { font-size: 14px; }
.served-row .t small { display: block; color: var(--muted); font-size: 12px; }
.nearby h4 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.nearby h4 span { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
.nearby .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip-btn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 5px; }
.nearby-item { padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.nearby-item:last-child { border-bottom: 0; }
.linklike { border: 0; background: none; padding: 0; color: var(--ink); font-weight: 700; cursor: pointer; text-align: left; }
.linklike:hover { text-decoration: underline; }
.empty { color: var(--muted); padding: 24px 0; }
.foot { padding: 10px 20px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); font-size: 11px; color: var(--faint); }
.foot a { color: inherit; }

/* ---------- vehicles ---------- */
.nowbar { margin: 8px 20px 0; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); display: grid; gap: 6px; }
.now-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.veh-toggle { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; }
.veh-toggle .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--rule); position: relative; transition: background .15s; }
.veh-toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.veh-toggle[aria-pressed="true"] .sw { background: var(--focus); }
.veh-toggle[aria-pressed="true"] .sw::after { transform: translateX(12px); }
.clock { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.clock b { font: 700 18px/1 var(--font-sign); color: var(--ink); letter-spacing: .02em; }
.linklike.small { font-size: 12px; font-weight: 400; color: var(--focus); margin-left: auto; }
.time-form { display: flex; gap: 6px; flex-wrap: wrap; }
.time-form input { padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); font-size: 13px; }
.btn { padding: 5px 10px; border-radius: 6px; border: 1px solid var(--focus); background: var(--focus); color: var(--panel); font-size: 13px; cursor: pointer; }
.btn.ghost { background: none; color: var(--focus); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.vstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vstats b { color: var(--ink); }
.vstats .gpsnote { flex-basis: 100%; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .veh { min-width: 18px; height: 12px; padding: 0; transform: none; position: static; box-shadow: none; }
.veh-wrap { background: none; border: 0; }
.veh {
  position: absolute; transform: translate(-50%, -50%); display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 20px; padding: 0 5px; border-radius: 10px; font: 700 13px/1 var(--font-sign); letter-spacing: .02em;
  white-space: nowrap; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); cursor: pointer;
}
.veh.gps { background: var(--c); color: var(--tc); border: 2px solid var(--panel); }
.veh.sched { background: var(--panel); color: var(--ink); border: 2px dashed var(--c); }
.zlow .veh { min-width: 0; width: 12px; height: 12px; padding: 0; font-size: 0; box-shadow: 0 0 0 2px var(--ink); }
.zlow .veh.gps { border: 2px solid var(--panel); }
.zlow .veh.sched { background: var(--panel); border: 3px solid var(--c); }
.pill { display: inline-block; font: 600 11px/1 var(--font-sign); letter-spacing: .04em; text-transform: uppercase; padding: 2px 5px; border-radius: 3px; vertical-align: 1px; }
.pill.gps { background: var(--focus); color: var(--panel); }
.pill.sched { border: 1px dashed var(--muted); color: var(--muted); }
.veh-pop .leaflet-popup-content-wrapper, .veh-pop .leaflet-popup-tip { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.veh-pop .leaflet-popup-content { margin: 12px 14px; font: 13px/1.45 var(--font-ui); }
.vp { display: grid; gap: 5px; }
.vp .muted { color: var(--muted); font-size: 12px; }
.vp .src { font-size: 12px; color: var(--muted); }
.vp-btn { justify-self: start; margin-top: 2px; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel-2); cursor: pointer; font-size: 12px; }
.live-note { margin: 0 0 10px; }
.deps { list-style: none; margin: 0; padding: 0; display: grid; }
.deps li button { display: grid; grid-template-columns: 44px auto 1fr auto; gap: 8px; align-items: center; width: 100%; padding: 5px 4px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px; }
.deps li button:hover { background: var(--panel-2); }
.deps .dt { font: 700 16px/1 var(--font-sign); font-variant-numeric: tabular-nums; }
.deps .dh { font-size: 13px; }
.deps .dm { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- map picker + tooltips ---------- */
.tt-lines { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; }
.pick { display: grid; gap: 2px; max-height: 240px; overflow-y: auto; margin-top: 4px; }
.pick-row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; padding: 4px; border: 0; background: none; border-radius: 5px; cursor: pointer; text-align: left; font-size: 13px; }
.pick-row:hover { background: var(--panel-2); }
/* panel updates (clock every 2 s) must not re-lay out the long line list */
.nowbar { contain: content; }
.list > li { content-visibility: auto; contain-intrinsic-size: auto 40px; }

/* ---------- map ---------- */
#map { height: 100%; width: 100%; background: var(--bg); }
/* plain opacity over the page ground: cheap to composite while panning, unlike a CSS filter */
#map .leaflet-tile-pane { opacity: var(--tile-opacity); }
.leaflet-container { font: 13px/1.4 var(--font-ui); }
.leaflet-tooltip.tt { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 6px; padding: 5px 8px; }
.leaflet-tooltip.tt::before { display: none; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 85%, transparent) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--rule) !important; }
.map-hint {
  position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 450; pointer-events: none;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px;
}
.endlabel { background: var(--ink); color: var(--panel); border-radius: 4px; padding: 2px 6px; font: 600 13px/1.2 var(--font-sign); letter-spacing: .02em; white-space: nowrap; box-shadow: var(--shadow); }
.mapwrap { position: relative; min-height: 0; }

@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 48% 52%; }
  .mapwrap { grid-row: 1; }
  #panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--rule); padding-top: 0; }
  .masthead { padding: 10px 16px 8px; }
  .masthead p { display: none; }
  .overlays { padding: 8px 16px 2px; grid-template-columns: repeat(3, 1fr); }
  .overlays .label { grid-column: 1 / -1; display: none; }
  .op-toggle { grid-template-columns: 16px 1fr; padding: 6px 8px; gap: 6px; }
  .op-toggle .ct, .op-toggle .nm small { display: none; }
  .op-toggle .nm { font-size: 13px; }
  .search { padding: 8px 16px; }
  .nowbar { margin: 6px 16px 0; padding: 8px 10px; }
  .legend { display: none; }
  #view { padding: 0 16px 16px; }
  .foot { display: none; }
  .map-hint { bottom: 12px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<aside id="panel" aria-label="Network explorer">
  <header class="masthead">
    <h1>MOVE-C <span class="tag">Região de Coimbra</span></h1>
    <p>Lines and stops of SMTUC, Metro Mondego and SIT Metropolitano on one map.</p>
  </header>
  <div class="overlays" role="group" aria-labelledby="ovl-label">
    <span class="label" id="ovl-label">Overlays</span>
    <div id="toggles" style="display:contents"></div>
  </div>
  <div class="nowbar" aria-label="Vehicles now">
    <div class="now-row">
      <button type="button" class="veh-toggle" id="veh-toggle" aria-pressed="true"><span class="sw" aria-hidden="true"></span>Vehicles</button>
      <span class="clock" id="clock">Loading timetables…</span>
      <button type="button" class="linklike small" id="time-btn">Change time</button>
    </div>
    <form class="time-form" id="time-form" hidden>
      <label for="t-date" class="sr">Date</label><input type="date" id="t-date" required>
      <label for="t-time" class="sr">Time</label><input type="time" id="t-time" required>
      <button type="submit" class="btn">Show</button>
      <button type="button" class="btn ghost" id="t-now">Now</button>
    </form>
    <div class="vstats" id="vstats"></div>
    <div class="legend"><span><i class="veh gps" style="--c:var(--muted)"></i>Live GPS</span><span><i class="veh sched" style="--c:var(--muted)"></i>Timetable estimate</span></div>
  </div>
  <div class="search">
    <label for="q" class="label" style="display:block;margin-bottom:6px">Find a line or stop</label>
    <input id="q" type="search" placeholder="e.g. 205, Portagem, Lousã" autocomplete="off">
  </div>
  <div id="view" tabindex="-1"></div>
  <footer class="foot" id="foot"></footer>
</aside>
<div class="mapwrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="map-hint" id="hint">Click a line or a stop on the map</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js?v=2026-09-28T1106"></script>
<script src="app.js?v=2026-09-28T1106"></script>
</body>
</html>
